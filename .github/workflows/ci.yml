# 자동 검사. PR을 올리거나 main·작업 브랜치에 올릴 때마다 돈다.
#   checks: 코드 실수(lint), 타입, 단위 테스트, DB 권한 테스트, 배포용 빌드
#   e2e:    Supabase를 통째로 띄우고 앱을 켠 뒤, 대표·회원이 브라우저로 핵심 흐름을 한 바퀴 돈다 (e2e/)
# 비밀값은 쓰지 않는다. e2e의 Supabase 키는 이 작업 안에서만 쓰는 테스트용 값이다.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Supabase 띄우기 (migrations 1~14번 적용)
        run: supabase start -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
      - name: 테스트용 환경변수
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "PII_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } > .env.local
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: 실패하면 Supabase 로그
        if: failure()
        run: docker ps -a && for c in $(docker ps -aq --filter name=supabase); do echo "== $c"; docker logs --tail 80 "$c" 2>&1; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
